[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitbloom"
version = "0.1.0"
description = "Turn your commit history into a procedurally grown garden"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
gitbloom = "gitbloom.cli:main"

[tool.setuptools.packages.find]
include = ["gitbloom*"]
